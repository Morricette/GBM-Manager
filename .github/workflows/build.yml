# Fabrique GBM_Manager.exe sur Windows et le publie dans une version (Release) GitHub.
# Se lance a chaque envoi sur main : si la version (VERSION dans GBM_Manager.py) n'est pas encore publiee,
# le .exe est fabrique et la version vX.Y.Z est creee. Bouton "Run workflow" : meme chose a la main.
name: Fabriquer GBM_Manager.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version a publier
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^VERSION = ' GBM_Manager.py | cut -d'"' -f2)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "nouvelle=non" >> "$GITHUB_OUTPUT"; echo "v$v deja publiee"; else echo "nouvelle=oui" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.v.outputs.nouvelle == 'oui'
        with:
          python-version: "3.12"
      - name: Fabriquer le .exe
        if: steps.v.outputs.nouvelle == 'oui'
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --onefile --noconsole --name GBM_Manager --icon icone.ico --add-data "icone.ico;." GBM_Manager.py
      - name: Publier la version
        if: steps.v.outputs.nouvelle == 'oui'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="${{ steps.v.outputs.tag }}"
          gh release create "$t" dist/GBM_Manager.exe LISEZMOI.txt GUIDE-BOT-DISCORD.txt --target "$GITHUB_SHA" \
            --title "GBM Manager ${t#v}" \
            --notes "Telechargez GBM_Manager.exe ci-dessous. Mode d'emploi : LISEZMOI.txt, et l'onglet Aide de l'application."
